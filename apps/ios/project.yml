# XcodeGen spec: `make ios-project` writes HollywoodRemote.xcodeproj (not committed).
name: HollywoodRemote
options:
  bundleIdPrefix: dev.cardozo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  RemoteKit:
    path: RemoteKit
targets:
  HollywoodRemote:
    type: application
    platform: iOS
    sources:
      - path: HollywoodRemote
    dependencies:
      - package: RemoteKit
        product: RemoteKit
    info:
      path: HollywoodRemote/Info.plist
      properties:
        CFBundleDisplayName: Hollywood
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: Para encontrar la tele en la red de casa y controlarla.
        NSBonjourServices: [_androidtvremote2._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cardozo.hollywood.remote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Free Apple account: pick your Personal Team in Xcode the first time (Signing & Capabilities).
        DEVELOPMENT_TEAM: ""
